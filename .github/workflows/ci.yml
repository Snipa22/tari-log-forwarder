on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check script
        run: bash -n tari-log-forwarder.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck tari-log-forwarder.sh

      - name: Validate systemd unit
        run: |
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify ./tari-log-forwarder.service
          else
            echo "systemd-analyze not available on this runner; falling back to structural sanity checks"
            test -f tari-log-forwarder.service
            grep -q '^\[Unit\]' tari-log-forwarder.service
            grep -q '^\[Service\]' tari-log-forwarder.service
            grep -q '^\[Install\]' tari-log-forwarder.service
            grep -q '^ExecStart=' tari-log-forwarder.service
          fi
