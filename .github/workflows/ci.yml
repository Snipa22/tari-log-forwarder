on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check script
        run: bash -n tari-log-forwarder.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck tari-log-forwarder.sh

      - name: Validate systemd unit
        run: |
          # `systemd-analyze verify` requires ExecStart's target binary to
          # exist on-disk at the exact path in the unit (it resolves and
          # checks the executable) — that's a real fleet-node path
          # (/usr/local/bin/tari-log-forwarder.sh), not something present on
          # a CI runner, so a strict `verify` here would fail for reasons
          # unrelated to unit-file correctness. Point ExecStart at this
          # checkout's copy of the script for the verify pass instead, then
          # always run structural sanity checks on the real file too.
          if command -v systemd-analyze >/dev/null 2>&1; then
            sed "s#/usr/local/bin/tari-log-forwarder.sh#$(pwd)/tari-log-forwarder.sh#" \
              tari-log-forwarder.service > /tmp/tari-log-forwarder.service
            systemd-analyze verify /tmp/tari-log-forwarder.service
          else
            echo "systemd-analyze not available on this runner; structural checks only"
          fi
          test -f tari-log-forwarder.service
          grep -q '^\[Unit\]' tari-log-forwarder.service
          grep -q '^\[Service\]' tari-log-forwarder.service
          grep -q '^\[Install\]' tari-log-forwarder.service
          grep -q '^ExecStart=' tari-log-forwarder.service
